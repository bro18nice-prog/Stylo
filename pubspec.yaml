name: outfit
description: "Personal wardrobe, outfit planning, and mannequin previews."
publish_to: 'none'

version: 1.1.1+6

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0
  image: ^4.5.4
  image_background_remover: ^2.0.1

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  geolocator: ^14.0.3
  http: ^1.3.0
  webview_flutter: ^4.10.0
  path_provider: ^2.1.5
  purchases_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/avatar/

